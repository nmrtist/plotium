[alias]
pr-check = "run -q -p xtask -- pr-check"
dependency-check = "run -q -p xtask -- dependency-check"
release-check = "run -q -p xtask -- release-check"
licenses = "run -q -p xtask -- licenses"
xtask = "run -q -p xtask --"

# Development and shipping builds use the reference table executor. DataFusion
# remains available through a separate, explicit maintenance build.
release-build = "build --locked --release -p plotium"
datafusion-build = "build --locked --release -p plotium --features datafusion"
