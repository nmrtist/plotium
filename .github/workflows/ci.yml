name: CI

# No workflow-level path filters: a filtered-out workflow never reports its
# checks, which deadlocks pull requests once a check is required. Instead the
# `changes` job classifies the changed paths and the heavy jobs skip
# themselves; branch protection should require only `conclusion`, which
# treats skipped jobs as passing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs are cancelled on main too. A cancelled push is not lost:
# the next push classifies its changes against the last successful main run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Incremental compilation only bloats the CI caches.
  CARGO_INCREMENTAL: "0"

jobs:
  # Decides which job groups this change needs. Fails open: when the changed
  # files cannot be determined (workflow_dispatch, branch creation, API
  # hiccup, or a push too large for the compare API), everything runs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      docs: ${{ steps.classify.outputs.docs }}
      dependencies: ${{ steps.classify.outputs.dependencies }}
    steps:
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rust=true
          docs=true
          dependencies=true
          files=""
          case "${{ github.event_name }}" in
            pull_request)
              files=$(gh api --paginate \
                "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                --jq '.[].filename') || files=""
              ;;
            push)
              # Diff against the last green push run, not the previous
              # commit, so changes from cancelled runs are still checked.
              before=$(gh api \
                "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=${{ github.ref_name }}&event=push&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // empty') || before=""
              if [ -n "$before" ]; then
                files=$(gh api \
                  "repos/${{ github.repository }}/compare/$before...${{ github.sha }}" \
                  --jq '.files[].filename') || files=""
                # The compare API caps the file list at 300 entries; a longer
                # list may be truncated, so run everything instead.
                if [ "$(printf '%s\n' "$files" | wc -l)" -ge 300 ]; then
                  files=""
                fi
              fi
              ;;
          esac
          if [ -n "$files" ]; then
            rust=false
            docs=false
            dependencies=false
            while IFS= read -r file; do
              case "$file" in
                Cargo.toml|*/Cargo.toml|Cargo.lock|deny.toml|.cargo/config.toml|xtask/*|.github/workflows/*)
                  dependencies=true ;;
              esac
              case "$file" in
                # Workflow changes must prove every job still works.
                .github/*) rust=true; docs=true ;;
                docs/*) docs=true ;;
                # Markdown is safe to skip because no Rust source embeds it
                # (assets are embedded, so asset changes keep rust=true).
                LICENSE|*.md) ;;
                *) rust=true ;;
              esac
            done < <(printf '%s\n' "$files")
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "dependencies=$dependencies" >> "$GITHUB_OUTPUT"
          echo "rust=$rust docs=$docs dependencies=$dependencies"

  # Formatting and source sizes are platform-independent
  # and build nothing but xtask itself, so one cheap uncached runner fails
  # within minutes. Always runs: it is fast and covers every file kind.
  quick:
    name: quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt

      - name: Test release packaging contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/plotium-packaging-python"
          "$RUNNER_TEMP/plotium-packaging-python/bin/python" -m pip install -r .github/scripts/requirements-packaging.txt
          "$RUNNER_TEMP/plotium-packaging-python/bin/python" -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Check formatting and source sizes
        run: cargo xtask pr-check quick

  dependencies:
    name: dependency policy
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    uses: ./.github/workflows/dependency-check.yml

  lint:
    name: lint (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add clippy

      # The bundled LLD links the test binaries faster than link.exe.
      # Before rust-cache, which keys on CARGO_* variables; release builds
      # keep the default linker.
      - name: Link with rust-lld on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe" >> "$GITHUB_ENV"

      # After toolchain setup so the cache key sees the final rustc version.
      # Only main writes caches: pull requests restore main's entry, keeping
      # one cache per platform and job inside the repository quota.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check default frontends and run Clippy
        run: cargo xtask pr-check lint

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable

      - name: Link with rust-lld on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Test vector icon generation
        if: runner.os == 'macOS'
        run: cargo test --locked -p xtask --features macos-packaging

      - name: Run the reference-backend test suite
        run: cargo xtask pr-check test

  # Validates that the user manual builds. Deployment is separate: Cloudflare
  # Workers Builds watches pushes and deploys on its own.
  docs:
    name: build manual
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build the user manual
        run: npm run build
        working-directory: docs

  # The single job branch protection should require. Skipped jobs pass, so
  # path-skipped groups never deadlock a pull request, and matrix or job
  # renames never require touching the protection settings.
  conclusion:
    name: conclusion
    needs: [changes, quick, dependencies, lint, test, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed or be skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e '[.[].result] | all(. == "success" or . == "skipped")'
