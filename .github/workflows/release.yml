name: Release

on:
  push:
    tags: ['v*']
  # Build the selected ref for a rehearsal, without creating a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'

jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release version
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 .github/scripts/release_version.py

  dependencies:
    needs: version
    uses: ./.github/workflows/dependency-check.yml

  build:
    needs: [version, dependencies]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PLOTIUM_RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Update Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: matrix.target != 'x86_64-apple-darwin'
        with:
          tool: cargo-about@0.9.1
      - name: Install cargo-about on Intel macOS
        if: matrix.target == 'x86_64-apple-darwin'
        run: cargo install cargo-about --version 0.9.1 --locked --features cli
      - name: Build release binaries
        run: cargo build --locked --release --target "$TARGET" -p plotium -p plotium-agent
      - name: Package macOS app and DMG
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/plotium-packaging-python"
          "$RUNNER_TEMP/plotium-packaging-python/bin/python" -m pip install -r .github/scripts/requirements-packaging.txt
          "$RUNNER_TEMP/plotium-packaging-python/bin/python" .github/scripts/package_macos.py --target "$TARGET" --skip-build
      - name: Test whole-app update using the packaged DMG and shipping helper
        if: runner.os == 'macOS'
        env:
          PLOTIUM_TEST_UPDATE_DMG: ${{ github.workspace }}/dist/plotium-${{ env.VERSION }}-${{ env.PLATFORM }}.dmg
        run: cargo test --locked -p plotium-core update::bundle::tests -- --nocapture
      - name: Package existing portable ZIP
        if: runner.os != 'macOS'
        run: python3 .github/scripts/package_portable.py --target "$TARGET" --skip-build
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/plotium-*.zip
            dist/plotium-*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: macos-verification-${{ matrix.platform }}
          path: dist/macos-validation-*.json
          if-no-files-found: error
          retention-days: 7

  collect:
    needs: [version, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Require Windows/Linux ZIPs and both macOS DMGs; generate and verify checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 .github/scripts/collect_release.py dist "$VERSION"
          cd dist && sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: validated-release
          path: |
            dist/plotium-*.zip
            dist/plotium-*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft:
    if: github.event_name == 'push'
    needs: [version, collect]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: validated-release
          path: dist
      - name: Verify collected assets before attaching
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Create or update release draft
        run: |
          if gh release view "$TAG" --json isDraft > release.json; then
            jq -e '.isDraft == true' release.json
          else
            flags=()
            if [ "$CHANNEL" != stable ]; then flags+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --draft --title "Plotium $VERSION" \
              --generate-notes "${flags[@]}"
          fi
          gh release upload "$TAG" dist/*.zip dist/*.dmg dist/SHA256SUMS --clobber
