[package]
name = "plotium-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
plotium-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { workspace = true, features = ["net", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false }
plotium-io.workspace = true
num-complex.workspace = true
