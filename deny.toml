# Dependency security, duplicate-version, and source policy for Plotium.
# `cargo dependency-check` runs advisories, bans, and sources; license checking
# is intentionally excluded.

[graph]
all-features = false
# Every platform CI builds or releases ship on.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "simplest-path"
deny = [
    # calamine >=0.37 and rust_xlsxwriter >=0.100 now use zip >=9 too. Prevent
    # reintroducing the extraction vulnerabilities RUSTSEC-2026-0367/0368/0369
    # through any consumer, including dependencies that only read ZIP streams.
    { name = "zip", version = "<9.0.0", reason = "All ZIP consumers must use the patched extraction implementation" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
